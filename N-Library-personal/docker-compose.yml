version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: n-library-db
    environment:
      MYSQL_ROOT_PASSWORD: Kavindu12345
      MYSQL_DATABASE: library_manage
      MYSQL_USER: library_user
      MYSQL_PASSWORD: library_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - library-network
    restart: unless-stopped

  # Java EE Application
  app:
    build: .
    container_name: n-library-app
    ports:
      - "8050:8080"
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: library_manage
      DB_USER: root
      DB_PASSWORD: Kavindu12345
    networks:
      - library-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  library-network:
    driver: bridge